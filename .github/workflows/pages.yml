name: Publicar la web
# El código vive en este repositorio privado. La app construida se publica en el
# repositorio público lucapp-web (rama gh-pages), que es el único que se ve.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ${{ github.repository_owner }}/lucapp-web
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Publicar LucApp"
